<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KNPC Gateway Animation Canvas</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent !important;
        }
    </style>
</head>
<body>
    <canvas id="animationCanvas"></canvas>
    <script>
        const canvas = document.getElementById('animationCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const wordsList = ["Crude", "Naphtha", "Gasoline", "Jet Kerosene", "LPG"];
        const particles = [];

        class PhraseParticle {
            constructor(text) {
                this.text = text;
                this.reset();
                // Randomize initial location layout bounds
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
            }

            reset() {
                this.fontSize = Math.floor(Math.random() * 8) + 16; // 16px to 24px hierarchy
                ctx.font = `600 ${this.fontSize}px 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif`;
                this.width = ctx.measureText(this.text).width;
                this.height = this.fontSize;
                
                // Physics properties vectors configuration maps
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.angle = Math.random() * Math.PI * 2;
                this.spinSpeed = (Math.random() - 0.5) * 0.02;
                
                // Fluent-style multi-accent palette (Windows 11 tile accent set)
                const fluentAccents = [
                    [0, 120, 212],   // Communication blue
                    [0, 183, 195],   // Teal
                    [135, 100, 184], // Purple
                    [16, 124, 16],   // Green
                    [202, 80, 16],   // Rust/orange
                ];
                const [r, g, b] = fluentAccents[Math.floor(Math.random() * fluentAccents.length)];
                const alpha = (Math.random() * 0.35 + 0.35).toFixed(2);
                this.color = `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.spinSpeed;

                // Wall collision handling parameters checking structures
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                // Absolute boundary clamp safety logic routines
                if (this.x < -100) this.x = canvas.width + 50;
                if (this.x > canvas.width + 100) this.x = -50;
                if (this.y < -100) this.y = canvas.height + 50;
                if (this.y > canvas.height + 100) this.y = -50;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.font = `600 ${this.fontSize}px 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif`;
                ctx.fillStyle = this.color;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.text, 0, 0);
                ctx.restore();
            }
        }

        // Initialize kinetic loop population arrays
        wordsList.forEach(word => {
            // Generate multiple variations to create density inside space
            for(let i = 0; i < 3; i++) {
                particles.push(new PhraseParticle(word));
            }
        });

        function renderFrameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(renderFrameLoop);
        }

        renderFrameLoop();
    </script>
</body>
</html>
